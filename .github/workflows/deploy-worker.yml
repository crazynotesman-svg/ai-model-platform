name: Deploy Worker + D1

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 生产 D1：迁移（幂等）
      - name: Apply D1 migrations (remote)
        run: pnpm exec wrangler d1 migrations apply ai-model-platform-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 生产 seed：仅 production 数据（不含 demo benchmark / 示例资讯）
      - name: Seed production data
        run: pnpm exec wrangler d1 execute ai-model-platform-db --remote --file=../database/seed/seed-production.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 部署后冒烟：生产 API 健康检查
      - name: Smoke test production API
        run: |
          BASE="https://ai-model-platform-api.crazynotesman.workers.dev"
          curl -fsS "$BASE/api/v1/models?lang=en" | head -c 200
          echo
          curl -fsS "$BASE/api/v1/ranking?lang=en" | head -c 200
          echo
          curl -fsS "$BASE/api/health"
