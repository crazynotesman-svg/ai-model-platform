# ============================================================================
# 自动部署：push main 触发
#   CI（install + typecheck + check）→ 构建（本地 D1 seed + 数据导出）
#   → 部署 Cloudflare Pages（静态站点）+ Cloudflare Worker（API/Cron）
#   → 远程 D1 迁移 + seed（幂等）
#
# 需要的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN    Cloudflare API Token（权限：Workers Scripts:Edit、
#                           Workers Routes:Edit、Account Settings:Read、
#                           Pages:Edit、D1:Edit）
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare 账户 ID
#   D1_DATABASE_ID          D1 数据库 ID（npx wrangler d1 create 的输出）
# ============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- 类型检查（Worker + Frontend）----
      - name: Typecheck
        run: pnpm typecheck

      # ---- 构建前端（构建期从本地 D1 导出模型/对比数据）----
      - name: Prepare local D1 (migrate + seed)
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply ai-model-platform-db --local
          npx wrangler d1 execute ai-model-platform-db --local --file=../database/seed/seed.sql

      - name: Build frontend
        run: pnpm build

      # ---- 部署静态站点到 Cloudflare Pages ----
      # 首次运行前：npx wrangler pages project create ai-model-platform（或改下面项目名）
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy frontend/dist --project-name=ai-model-platform --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---- 部署 Worker（API + Cron）----
      - name: Deploy Worker
        working-directory: worker
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.toml
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      # ---- 远程 D1：应用迁移 + 种子数据（幂等，可重复执行）----
      - name: Apply D1 migrations (remote)
        working-directory: worker
        run: npx wrangler d1 migrations apply ai-model-platform-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed remote D1
        working-directory: worker
        run: npx wrangler d1 execute ai-model-platform-db --remote --file=../database/seed/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
