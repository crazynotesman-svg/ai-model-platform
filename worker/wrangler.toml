# Cloudflare Worker 配置 —— ai-model-platform-api
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "ai-model-platform-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# ---- D1 数据库绑定（Phase 5 启用）----
# 创建数据库：npx wrangler d1 create ai-model-platform-db
# 创建后把返回的 database_id 填入下方，并执行迁移：
#   npx wrangler d1 migrations apply ai-model-platform-db --local   # 本地
#   npx wrangler d1 migrations apply ai-model-platform-db --remote  # 远程
# 迁移目录指向仓库根的 database/migrations（相对本文件位置）
[[d1_databases]]
binding = "DB"
database_name = "ai-model-platform-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../database/migrations"
