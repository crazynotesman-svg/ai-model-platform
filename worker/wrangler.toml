# Cloudflare Worker 配置 —— ai-model-platform-api
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "ai-model-platform-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# ---- D1 数据库绑定 ----
# 远程数据库：npx wrangler d1 create ai-model-platform-db → 将返回的 database_id 填入下方
# 本地开发：无需 create，migrations apply --local 会自动创建本地库
# 命令（均在 worker/ 目录下运行）：
#   npx wrangler d1 migrations apply ai-model-platform-db --local   # 本地建表
#   npx wrangler d1 migrations apply ai-model-platform-db --remote  # 远程建表
#   npx wrangler d1 execute ai-model-platform-db --local --file=../database/seed/seed.sql

[[d1_databases]]
binding = "DB"
database_name = "ai-model-platform-db"
database_id = "94d5cd6c-4ed4-4d1f-b19a-26335b7df37a"
# 迁移目录：相对运行 wrangler 命令的目录（worker/ → 项目根 database/migrations）
migrations_dir = "../database/migrations"

# ---- 定时任务 ----
# 01:00 新闻采集；02:00 排名快照；03:00 Data Trust 审计（11.5B）；每 6 小时 Data Discovery（11.6）
# 本地测试：npx wrangler dev --test-scheduled（发送 POST /__scheduled 触发）
[triggers]
crons = ["0 1 * * *", "0 2 * * *", "0 3 * * *", "0 */6 * * *"]
